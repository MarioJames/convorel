name: release
on:
  push:
    tags: ["v*"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require the tag to match VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Prepare workspace sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux
          # Ephemeral hosted runner; the sandbox still unshares namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: test -z "$(gofmt -l cmd internal scripts/*.go)"
      - run: go vet ./...
      - run: go test ./...
      - run: scripts/build.sh
      - run: scripts/test-install.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Attest the artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | bash -s -- --version $tag"
            echo '```'
            echo
            echo "Static Linux x64 and arm64. Verify provenance with \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat dist/sha256sums.txt
            echo '```'
          } > "$notes"
          flags=()
          case "$tag" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber dist/convorel-*.tar.gz dist/sha256sums.txt
          else
            gh release create "$tag" --verify-tag --title "$tag" \
              --generate-notes --notes-file "$notes" "${flags[@]}" \
              dist/convorel-*.tar.gz dist/sha256sums.txt
          fi
