name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Prepare workspace sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux
          # Ephemeral hosted runner; the sandbox still unshares namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Format
        run: test -z "$(gofmt -l cmd internal scripts/*.go)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o "$RUNNER_TEMP/convorel" ./cmd/convorel
